<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <title>Page not found · Shared pages</title>
  <style>
    :root{color-scheme:light;--ink:#18332d;--muted:#64756e;--paper:#f4f6f0;--line:#d9e2da;--green:#185d4d}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    header{border-bottom:1px solid var(--line);padding:19px 24px;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
    main{width:min(100% - 40px,760px);margin:12vh auto}
    h1{font:500 clamp(42px,8vw,72px)/1 Georgia,serif;letter-spacing:-.04em;margin:16px 0}
    p{color:var(--muted);max-width:620px}
    a{color:var(--green)}
  </style>
  <script>
    if (window.location.pathname === "/pages/," || window.location.pathname === "/pages/,/") {
      window.location.replace("/pages/");
    }
  </script>
</head>
<body>
  <header>Pages · shared files</header>
  <main>
    <h1>Page not found</h1>
    <p>This shared page may have expired or the address may be incorrect.</p>
    <p><a href="/pages/">Return to the Pages home</a></p>
  </main>
</body>
</html>
